; Compilar com PlatformIO:  pio run -t upload
[platformio]
src_dir = z2m_alexa

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.2
; a Espalexa vem dentro de z2m_alexa/ (cópia com ajustes: tomada Hue e gancho SSDP para WeMo)
